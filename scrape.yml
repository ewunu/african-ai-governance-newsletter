name: Scrape AI Governance News

on:
  schedule:
    # 5:00 AM Cairo time (UTC+2) = 3:00 AM UTC
    - cron: '0 3 * * *'
    # 2:00 PM Cairo time = 12:00 PM UTC
    - cron: '0 12 * * *'
    # 9:00 PM Cairo time = 7:00 PM UTC
    - cron: '0 19 * * *'
  
  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          cd src
          python scraper.py
      
      - name: Log completion
        run: |
          echo "Scrape completed at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
